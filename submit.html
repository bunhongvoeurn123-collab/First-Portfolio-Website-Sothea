<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Me | Glassmorphism</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
            rel="stylesheet">

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <link rel="stylesheet" href="submit.css">
        <script src="submit.js" defer></script>
    </head>
    <body>

        <div class="back-btn-container">
            <a href="New Portfolio.html"><button id="theme-btn"
                    title="Back to Portfolio">↩</button></a>
        </div>

        <div class="main-wrapper">
            <div class="login-box">
                <form id="loginForm">
                    <h2>Let's Message</h2>

                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" required
                            name="username" />
                        <label>Username</label>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required name="email" />
                        <label>Your Email</label>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-comment-dots"></i>
                        <textarea id="text" required name="text"
                            rows="3"></textarea>
                        <label>Your Message</label>
                    </div>

                    <button type="submit" class="login-btn" id="submitBtn">Send
                        Message</button>
                </form>
            </div>
        </div>

    </body>
</html>
